[workspace]
name = "vOSSE-blob"
description = "Evaluating new observations system designs (OSSEs) for marine heatwaves, using VirtualShip to authentically simulate real-life observations."
version = "0.1.0"
channels = ['conda-forge']
platforms = ['linux-64', 'osx-64', 'osx-arm64', 'win-64']

[dependencies]
python = "~=3.12.0"
pip = "*"

# Linting / formatting / type checking
loguru = "*"
ruff = "*"
mypy = "*"

# CLI
tqdm = "*"
typer = "*"

# Scientific core
numpy = ">=1,<2"
pandas = "*"
scipy = "*"
xarray = "*"
statsmodels = "*"
bottleneck = "*"
patsy = "*"
numba = "*"

# Visualisation
matplotlib-base = "*"
seaborn = "*"
bokeh = "*"
altair = "*"
cmocean = "*"
cartopy = "*"
shapely = "*"
pyproj = ">=3,<4"
pyshp = "*"

# NetCDF / HDF / Zarr
netcdf4 = "*"
h5netcdf = "*"
h5py = "*"
zarr = "*"
cftime = "*"

# Dask (pinned to match marEx 4.x requirement)
dask = "==2025.3.0"

# Cloud / remote storage
fsspec = "*"
gcsfs = "*"
boto3 = "*"
s3transfer = "*"
botocore = "*"

# Ocean / Met domain packages
parcels = ">3.1.0"
copernicusmarine = ">=2.2.2"
cf_xarray = "*"
roaring-landmask = "*"
pystac = "*"
opensimplex = "==0.4.5"
python-librt = "*"
sortedcontainers = "==2.4.0"


# Data I/O
pyarrow = "*"
openpyxl = "*"
orjson = "*"
pyyaml = "*"
simplejson = "*"

# Jupyter / notebooks
ipykernel = "*"
ipython = "*"
nbformat = "*"
nbconvert = "*"
nbsphinx = "*"
nbclient = "*"
jupyter_client = "*"
jupyter_core = "*"

# Dev / testing
pytest = "*"
pytest-asyncio = "*"
pytest-cov = "*"
pytest-timeout = "*"
pre-commit = "*"
coverage = "*"
codecov = "*"
ipdb = "*"
virtualenv = "*"

# Networking / HTTP
requests = "*"
aiohttp = "*"
httpx = "*"
urllib3 = "*"
cryptography = "*"
pyopenssl = "*"

# Misc utilities
pydantic = ">=2,<3"
pyzmq = "*"
packaging = "*"
certifi = "*"
six = "*"
attrs = "*"
decorator = "*"
filelock = "*"
platformdirs = "*"
psutil = "*"
wrapt = "*"
networkx = "*"
ocetrac = ">=0.1.4,<0.2"

[pypi-dependencies]
python-dotenv = "*"
vosse = { path = ".", editable = true }
virtualship = { git = "https://github.com/OceanParcels/virtualship.git", branch = "main" }
marEx = ">=4.1"
plotly = "*"
jupyterlab = "*"
cookiecutter-data-science = "*"
streamlit-bokeh = "*"
analytics-python = "*"
backoff = "*"
monotonic = "*"
